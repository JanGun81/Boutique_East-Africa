# Publicerar mappen showroom/ som statisk GitHub Pages-sajt.
# Aktivera: Repo → Settings → Pages → Source: GitHub Actions.

name: Deploy showroom to GitHub Pages

on:
  # Alla push till main – annars körs inte deploy om mergen bara rör andra mappar
  # och Pages kan då visa gammal/ingen sajt efter byte till GitHub Actions.
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-showroom"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify showroom artifact
        run: |
          test -f showroom/index.html
          test -f showroom/styles.css
          test -f showroom/showroom.js
          test -f showroom/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showroom

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
